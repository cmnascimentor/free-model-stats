name: Benchmark NIM + OpenRouter Free Models

on:
  workflow_dispatch:
    inputs:
      model_limit:
        description: "Max OpenRouter free models to benchmark this cycle (least-recently-tested rotation)"
        required: false
        default: "20"
      nim_model_limit:
        description: "Optional cap on NIM catalog chat models. 0 = all discovered"
        required: false
        default: "0"
      router_runs:
        description: "Number of openrouter/free router calls"
        required: false
        default: "2"
      probes:
        description: "Space-separated OpenRouter probes. The first probe is also the NIM cross-provider baseline."
        required: false
        default: "hermes_triage"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  nim_group1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: breaker_state.json
          key: breaker-nim-group1-${{ github.run_id }}
          restore-keys: breaker-nim-group1-
      - name: Test NIM model group 1 on shared baseline
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group1
          NIM_MODEL_LIMIT: ${{ github.event.inputs.nim_model_limit || '0' }}
        run: |
          PROBES="${{ github.event.inputs.probes || 'hermes_triage' }}"
          CORE_PROBE="$(printf '%s\n' "$PROBES" | awk '{print $1}')"
          python3 scripts/nim/test_models.py --probe "$CORE_PROBE"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: results-nim-group1
          path: scripts/nim/results.json
          if-no-files-found: warn
          retention-days: 1

  nim_group2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: breaker_state.json
          key: breaker-nim-group2-${{ github.run_id }}
          restore-keys: breaker-nim-group2-
      - name: Test NIM model group 2 on shared baseline
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group2
          NIM_MODEL_LIMIT: ${{ github.event.inputs.nim_model_limit || '0' }}
        run: |
          PROBES="${{ github.event.inputs.probes || 'hermes_triage' }}"
          CORE_PROBE="$(printf '%s\n' "$PROBES" | awk '{print $1}')"
          python3 scripts/nim/test_models.py --probe "$CORE_PROBE"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: results-nim-group2
          path: scripts/nim/results.json
          if-no-files-found: warn
          retention-days: 1

  openrouter_benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: breaker_state.json
          key: breaker-openrouter-${{ github.run_id }}
          restore-keys: breaker-openrouter-
      - name: Download prior canonical DB for scheduler state
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: benchmark.yml
          workflow_conclusion: success
          name: history-db
          path: scheduler-seed
          if_no_artifact_found: warn
      - name: Discover + benchmark OpenRouter free models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          MODEL_LIMIT="${{ github.event.inputs.model_limit || '20' }}"
          PROBES="${{ github.event.inputs.probes || 'hermes_triage' }}"
          ROUTER_RUNS="${{ github.event.inputs.router_runs || '2' }}"
          if [ -f scheduler-seed/history.db ]; then
            python3 scripts/openrouter/seed_scheduler.py --source scheduler-seed/history.db --target scratch.db
          fi
          python3 scripts/openrouter/discover_models.py --db scratch.db --mark-missing-inactive
          ARGS=""
          for p in $PROBES; do ARGS="$ARGS --probe $p"; done
          python3 scripts/openrouter/test_models.py --db scratch.db --limit "$MODEL_LIMIT" $ARGS
          python3 scripts/openrouter/test_router.py --db scratch.db --probe hermes_triage --runs "$ROUTER_RUNS"
          python3 scripts/openrouter/export_scratch.py --db scratch.db --out results-openrouter.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: results-openrouter
          path: results-openrouter.json
          if-no-files-found: warn
          retention-days: 1

  merge_and_update:
    needs: [nim_group1, nim_group2, openrouter_benchmark]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seed history.db from previous successful cycle
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: benchmark.yml
          workflow_conclusion: success
          name: history-db
          path: .
          if_no_artifact_found: warn
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - name: Merge NIM groups
        run: |
          found=0
          if [ -f artifacts/results-nim-group1/results.json ]; then
            cp artifacts/results-nim-group1/results.json scripts/nim/results-group1.json
            found=1
          fi
          if [ -f artifacts/results-nim-group2/results.json ]; then
            cp artifacts/results-nim-group2/results.json scripts/nim/results-group2.json
            found=1
          fi
          if [ "$found" -eq 1 ]; then
            python3 scripts/nim/merge_results.py
          else
            echo "No NIM artifacts found; skipping NIM merge."
          fi
      - name: Ingest OpenRouter artifact
        run: |
          if [ -f artifacts/results-openrouter/results-openrouter.json ]; then
            python3 scripts/ingest_openrouter_artifact.py --in artifacts/results-openrouter/results-openrouter.json
          else
            echo "No OpenRouter artifact found; skipping OpenRouter ingest."
          fi
      - name: Validate canonical database
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/common')
          import db
          conn = db.connect(db.HISTORY_DB)
          db.init_schema(conn)
          conn.commit()
          result = conn.execute('PRAGMA integrity_check').fetchone()[0]
          if result != 'ok':
              raise SystemExit(f'SQLite integrity_check failed: {result}')
          dangling = conn.execute('SELECT COUNT(*) FROM model_results mr LEFT JOIN runs r ON r.id=mr.run_id WHERE r.id IS NULL').fetchone()[0]
          if dangling:
              raise SystemExit(f'dangling model_results rows: {dangling}')
          conn.execute('VACUUM')
          conn.close()
          print('canonical database integrity: ok')
          PY
      - name: Upload history.db as artifact
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: history-db
          path: history.db
          if-no-files-found: error
          retention-days: 90

  deploy_pages:
    needs: [merge_and_update]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: history-db
          path: .
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          python3 scripts/assemble_site.py --source index.html --output _site/index.html
          cp history.db _site/
          cp -R vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
