name: Benchmark NIM + OpenRouter Free Models

on:
  workflow_dispatch:
    inputs:
      model_limit:
        description: "Max OpenRouter pinned free models to benchmark"
        required: false
        default: "20"
      nim_model_limit:
        description: "Optional cap on NIM catalog chat models to benchmark (discovered dynamically, split across the two groups). 0 = benchmark every discovered chat model"
        required: false
        default: "0"
      router_runs:
        description: "Number of openrouter/free router calls"
        required: false
        default: "2"
      probes:
        description: "Space-separated OpenRouter probes from prompts/"
        required: false
        default: "hermes_triage"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

# Never run two benchmark cycles at once: a second run would start from a stale
# history.db artifact and clobber the accumulated history. Queue instead of cancel.
concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  nim_group1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test NIM model group 1
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group1
          NIM_MODEL_LIMIT: ${{ github.event.inputs.nim_model_limit || '0' }}
        run: python3 scripts/nim/test_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-nim-group1
          path: scripts/nim/results.json
          retention-days: 1

  nim_group2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test NIM model group 2
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group2
          NIM_MODEL_LIMIT: ${{ github.event.inputs.nim_model_limit || '0' }}
        run: python3 scripts/nim/test_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-nim-group2
          path: scripts/nim/results.json
          retention-days: 1

  openrouter_benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover + benchmark OpenRouter free models (scratch db)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          MODEL_LIMIT="${{ github.event.inputs.model_limit || '20' }}"
          PROBES="${{ github.event.inputs.probes || 'hermes_triage' }}"
          ROUTER_RUNS="${{ github.event.inputs.router_runs || '2' }}"
          ARGS=""
          for p in $PROBES; do ARGS="$ARGS --probe $p"; done
          python3 scripts/openrouter/discover_models.py --db scratch.db --mark-missing-inactive --limit "$MODEL_LIMIT"
          python3 scripts/openrouter/test_models.py --db scratch.db $ARGS
          python3 scripts/openrouter/test_router.py --db scratch.db --probe hermes_triage --runs "$ROUTER_RUNS"
          python3 scripts/openrouter/export_scratch.py --db scratch.db --out results-openrouter.json
      - uses: actions/upload-artifact@v4
        with:
          name: results-openrouter
          path: results-openrouter.json
          retention-days: 1

  merge_and_update:
    needs: [nim_group1, nim_group2, openrouter_benchmark]
    # Publish even if some benchmark jobs failed, so a partial run still updates
    # history — but not if the whole workflow was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seed history.db from previous run
        # Start from the most recent successful run's history.db so history
        # accumulates across runs instead of being regenerated from scratch.
        # First cycle (no prior artifact) simply starts from the committed db.
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: benchmark.yml
          workflow_conclusion: success
          name: history-db
          path: .
          if_no_artifact_found: warn
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge NIM groups
        run: |
          cp artifacts/results-nim-group1/results.json scripts/nim/results-group1.json
          cp artifacts/results-nim-group2/results.json scripts/nim/results-group2.json
          python3 scripts/nim/merge_results.py
      - name: Ingest OpenRouter artifact
        run: |
          python3 scripts/ingest_openrouter_artifact.py --in artifacts/results-openrouter/results-openrouter.json
      - name: Upload history.db as artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-db
          path: history.db
          retention-days: 90

  deploy_pages:
    needs: [merge_and_update]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: history-db
          path: .
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp history.db _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
